# CI：安装依赖并运行 Task Harness 单元测试（无需 API Key / 外部服务）
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ZHIPUAI_API_KEY: ci_dummy_key_for_tests
      AGENT_TASK_HARNESS: "1"
      HITL_ENABLED: "0"
      AGENT_CHECKPOINT_ENABLED: "0"
      RAG_ENABLED: "0"
      GRAPHRAG_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 跳过可选的 awslabs MCP 解析包，加快 CI
          grep -v "awslabs-document-loader" requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt
          pip install psycopg[binary] psycopg-pool

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
